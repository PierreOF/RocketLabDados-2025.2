resources:
  jobs:
    Atividade_03_RocketLab:
      name: Atividade_03_RocketLab
      schedule:
        quartz_cron_expression: 16 0 13 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: landing_to_bronze
          notebook_task:
            notebook_path: Atividade02 - Arquitetura Medalhão/Atividade2_land_to_bronze
            source: GIT
        - task_key: bronze_to_silver
          depends_on:
            - task_key: landing_to_bronze
          notebook_task:
            notebook_path: Atividade02 - Arquitetura Medalhão/Atividade2_land_to_bronze
            source: GIT
        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          notebook_task:
            notebook_path: Atividade03 - Gold Layer + Views/Atividade3_silver_to_gold
            source: GIT
      git_source:
        git_url: https://github.com/PierreOF/RocketLabDados-2025.2
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
